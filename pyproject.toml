[project]
name = "aster-data-platform"
version = "0.1.0"
description = "Local AWS-compatible data platform compatibility spike"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3==1.40.70",
    "duckdb==1.4.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "pyarrow==21.0.0",
    "psycopg[binary]==3.2.12",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: requires provisioned MiniStack and PostgreSQL",
    "failure: exercises a documented failure scenario",
    "airflow: requires the local Airflow services",
    "observability: requires the local LGTM services",
]
