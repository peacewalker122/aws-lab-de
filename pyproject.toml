[project]
name = "aster-data-platform"
version = "0.1.0"
description = "Local AWS-compatible data platform compatibility spike"
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3==1.40.70",
    "duckdb==1.4.2",
    "pyarrow==21.0.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires provisioned MiniStack"]
