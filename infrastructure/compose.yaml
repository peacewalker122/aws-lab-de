services:
  postgres:
    image: docker.io/library/postgres:16.10
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: aster
      POSTGRES_DB: aster
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aster -d aster"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  ministack:
    image: docker.io/ministackorg/ministack:1.5.33-full
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3,athena,glue
      PERSIST_STATE: "1"
      S3_PERSIST: "1"
    volumes:
      - ministack-state:/tmp/ministack-state
      - ministack-s3:/tmp/ministack-data/s3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  loki:
    image: docker.io/grafana/loki:3.6.19
    profiles: ["observability"]
    security_opt:
      - label=disable
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki

  tempo:
    image: docker.io/grafana/tempo:2.10.10
    profiles: ["observability"]
    security_opt:
      - label=disable
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo

  prometheus:
    image: docker.io/prom/prometheus:v3.15.1
    profiles: ["observability"]
    security_opt:
      - label=disable
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  pushgateway:
    image: docker.io/prom/pushgateway:v1.11.5
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9091:9091"
    volumes:
      - pushgateway-data:/data
    command: ["--persistence.file=/data/pushgateway.data", "--persistence.interval=5m"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9091/-/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  grafana:
    image: docker.io/grafana/grafana:13.2.5
    profiles: ["observability"]
    security_opt:
      - label=disable
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  airflow:
    image: localhost/aster-airflow:3.1.0
    profiles: ["airflow"]
    build:
      context: ..
      dockerfile: infrastructure/airflow/Dockerfile
    env_file:
      - ../.env
    environment: &airflow-environment
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:Admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__DAG_CONCURRENCY: "2"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "15"
      PYTHONPATH: /opt/aster/src
      POSTGRES_HOST: postgres
      AWS_ENDPOINT_URL: http://ministack:4566
      ASTER_LOKI_URL: http://loki:3100
      ASTER_OTLP_ENDPOINT: http://tempo:4318
      ASTER_PUSHGATEWAY_URL: http://pushgateway:9091
    volumes: &airflow-volumes
      - ../orchestration/dags:/opt/airflow/dags:ro
      - ../src:/opt/aster/src:ro
      - ../sql:/opt/aster/sql:ro
    security_opt:
      - label=disable
  airflow-init:
    image: localhost/aster-airflow:3.1.0
    profiles: ["airflow"]
    env_file:
      - ../.env
    environment: *airflow-environment
    volumes: *airflow-volumes
    security_opt:
      - label=disable
    entrypoint: ["/opt/aster/entrypoint.sh"]
    command: ["init"]

  airflow-api-server:
    image: localhost/aster-airflow:3.1.0
    profiles: ["airflow"]
    env_file:
      - ../.env
    environment: *airflow-environment
    volumes: *airflow-volumes
    security_opt:
      - label=disable
    ports:
      - "127.0.0.1:8080:8080"
    entrypoint: ["/opt/aster/entrypoint.sh"]
    command: ["api-server"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/api/v2/monitor/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 30s

  airflow-scheduler:
    image: localhost/aster-airflow:3.1.0
    profiles: ["airflow"]
    env_file:
      - ../.env
    environment: *airflow-environment
    volumes: *airflow-volumes
    security_opt:
      - label=disable
    entrypoint: ["/opt/aster/entrypoint.sh"]
    command: ["scheduler"]

  airflow-dag-processor:
    image: localhost/aster-airflow:3.1.0
    profiles: ["airflow"]
    env_file:
      - ../.env
    environment: *airflow-environment
    volumes: *airflow-volumes
    security_opt:
      - label=disable
    entrypoint: ["/opt/aster/entrypoint.sh"]
    command: ["dag-processor"]

volumes:
  postgres-data:
  ministack-state:
  ministack-s3:
  loki-data:
  tempo-data:
  prometheus-data:
  pushgateway-data:
  grafana-data:
