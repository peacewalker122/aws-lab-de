services:
  postgres:
    image: docker.io/library/postgres:16.10
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: aster
      POSTGRES_DB: aster
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aster -d aster"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  ministack:
    image: docker.io/ministackorg/ministack:1.5.33-full
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3,athena,glue
      PERSIST_STATE: "1"
      S3_PERSIST: "1"
    volumes:
      - ministack-state:/tmp/ministack-state
      - ministack-s3:/tmp/ministack-data/s3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s


volumes:
  postgres-data:
  ministack-state:
  ministack-s3:
